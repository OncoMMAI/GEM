version: '3.8'

services:
  glioma-embedding:
    build:
      context: .
      dockerfile: Dockerfile
    image: glioma-embedding:latest
    container_name: glioma-embedding-main
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - PYTHONPATH=/app
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./figures:/app/figures
      - ./embeddings:/app/embeddings
      - ./configs:/app/configs
      - ./notebooks:/app/notebooks
      - huggingface-cache:/app/.cache/huggingface
    working_dir: /app
    command: bash
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vllm-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: glioma-embedding:latest
    container_name: glioma-vllm-server
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=4,5,6,7
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - huggingface-cache:/app/.cache/huggingface
    ports:
      - '8000:8000'
    command: >
      uv run vllm serve BioMistral-7B
      --gpu-memory-utilization=0.95
      --tensor-parallel-size=4
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
      --enforce-eager  # ensure compatibility with some CUDA setups
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4', '5', '6', '7']
              capabilities: [gpu]

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: glioma-embedding:latest
    container_name: glioma-jupyter
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/app
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./figures:/app/figures
      - ./embeddings:/app/embeddings
      - ./configs:/app/configs
      - ./notebooks:/app/notebooks
      - ./src:/app/src
      - huggingface-cache:/app/.cache/huggingface
    ports:
      - '8888:8888'
    command: >
      uv run jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:
    driver: local

# Configuration for model inference with BioMistral and other LLMs
# Matches setup in notebooks/02_gatatron_inference.ipynb

model:
  name: 'BioMistral-7B'
  base_url: 'http://localhost:8000/v1' # Local server URL for Gatortron
  api_key: 'token-abc123' # Local token that doesn't require authentication

inference:
  # Inference parameters
  batch_size: 10 # Process 10 examples at a time
  max_tokens: 50 # Short responses are sufficient for classification
  temperature: 0.0 # Use deterministic sampling
  num_threads: 4 # Process 4 batches in parallel
  max_retries: 3 # Retry failed requests up to 3 times

prompts:
  tumor_type: >
    You are an expert neuro-radiologist. Classify the brain tumor type.

    Clinical Notes:
    {text}

    Choose from:
    A: glioblastoma
    B: astrocytoma
    C: oligodendroglioma

    Answer with a single letter.

  survival: >
    You are an expert neuro-oncologist. Predict 1-year survival.

    Clinical Notes:
    {text}

    Choose from:
    A: NOT_SURVIVE
    B: SURVIVE

    Answer with a single letter.

  mgmt: >
    You are an expert molecular pathologist. Predict MGMT promoter methylation.

    Clinical Notes:
    {text}

    Choose from:
    A: NEGATIVE
    B: POSITIVE

    Answer with a single letter.

data:
  # Paths to evaluation datasets
  type_path: 'data/eval/tumor_type_eval.csv'
  mgmt_path: 'data/eval/mgmt_eval.csv'
  os_path: 'data/eval/os_eval.csv'
  text_column: 'report'

evaluation:
  n_splits: 10 # K-fold (align with decoder inference script)
  random_state: 42
  metrics:
    - accuracy
    - precision
    - recall
    - f1_macro
    - aucroc

output:
  results_dir: 'results/BioMistral-7B'
  save_predictions: true

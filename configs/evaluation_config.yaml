# Configuration for model evaluation
#
# Evaluates embedding-based classifiers across three glioma tasks:
#   - tumor_type: 3-class classification (glioblastoma, astrocytoma, oligodendroglioma)
#   - survival: 1-year overall survival (binary)
#   - mgmt: MGMT promoter methylation status (binary)
#
# Each task reads all .npy embedding files from its directory and evaluates
# them with a Random Forest classifier using stratified k-fold CV.

global:
  seed: 7

model:
  base_model: 'jinaai/jina-embeddings-v3'
  finetuned_model: 'models/mnrl/final'
  trust_remote_code: true

embedding:
  # Base directory containing task subdirectories (tumor_type/, os/, mgmt/)
  # with .npy embedding files to evaluate.
  directory: 'embeddings'

data:
  type_path: 'data/eval/tumor_type_eval.csv'
  mgmt_path: 'data/eval/mgmt_eval.csv'
  os_path: 'data/eval/os_eval.csv'
  text_column: 'report'
  id_column: 'mrn'

evaluation:
  n_splits: 10
  random_state: 7
  n_estimators: 1000
  baseline_model: 'jina_base_text_match'
  # Optional: evaluate only specific models (by filename without .npy).
  # Omit or set to null to evaluate all .npy files in each task directory.
  # models:
  #   - jina_base_text_match
  #   - mnrl
  #   - contrastive
  #   - triplet

output:
  results_dir: 'results'

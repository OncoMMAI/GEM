# Baseline configuration (reference for all experiments)
# Dataset: Full, Task: text-matching, Batch Sampler: NO_DUPLICATES, LoRA: True
global:
  seed: 42

model:
  name: 'jinaai/jina-embeddings-v3'
  trust_remote_code: true
  default_task: 'text-matching'
  lora_main_params_trainable: true # True = LoRA adaptation, False = full fine-tuning

training:
  num_epochs: 5
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 8
  learning_rate: 0.00001
  warmup_ratio: 0.15
  max_grad_norm: 1.0
  batch_sampler: 'NO_DUPLICATES' # Options: 'DEFAULT' or 'NO_DUPLICATES'

data:
  train_path: '/home/neob/ai/paper/data/training/mnrl/train.csv'
  eval_path: '/home/neob/ai/paper/data/training/mnrl/eval.csv'

output:
  results_dir: '/data/users/neob/finetuning/results'
  model_dir: 'baseline'
